<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <style>
        /* Plus+Plaster brandmark — Cream + Green in light, Green ground in dark.
           Colours expressed in oklch for perceptual uniformity (matches the
           design-token convention used elsewhere in the app). Two values flip
           on prefers-color-scheme; the others stay constant so the horizontal
           bandage, gauze pad and dots read the same in both.

           Class names are prefixed `brand-plaster__` so when this SVG is
           inlined into the page (`?react` import for the nav brand mark), the
           styles don't leak onto unrelated `.bg` / `.dot` / etc. selectors.
           When the SVG is rendered standalone (browser favicon), the
           prefers-color-scheme @media here handles the OS-following dark
           variant. When inlined into the page, `main.scss` adds higher-
           specificity `html.dark` / `html.light` overrides so the brand mark
           tracks the user's explicit theme toggle as well. */
        .brand-plaster__bg       { fill: oklch(95.4% 3.25% 82.4deg); }   /* cream */
        .brand-plaster__strip-v  { fill: oklch(38.2% 10.25% 166.3deg); }  /* forest green */
        .brand-plaster__strip-h  { fill: oklch(78.9% 9% 78.6deg); }   /* tan */
        .brand-plaster__pad      { fill: oklch(78.9% 9% 78.6deg); }   /* tan */
        .brand-plaster__dot      { fill: oklch(38.2% 10.25% 166.3deg); }  /* forest green */
        .brand-plaster__stripe   {
            stroke: oklch(38.2% 10.25% 166.3deg);
            stroke-width: 0.7;
            opacity: 0.55;
        }

        @media (prefers-color-scheme: dark) {
            .brand-plaster__bg      { fill: oklch(38.2% 10.25% 166.3deg); }  /* forest green ground */
            .brand-plaster__strip-v { fill: oklch(97.7% 2.75% 84.6deg); }   /* paper */
        }
    </style>
    <rect class="brand-plaster__bg" width="64" height="64" rx="12"/>
    <g>
        <rect class="brand-plaster__strip-h" x="6" y="25" width="52" height="14" rx="7"/>
        <g class="brand-plaster__stripe">
            <line x1="11" y1="27" x2="11" y2="37"/>
            <line x1="14" y1="27" x2="14" y2="37"/>
            <line x1="50" y1="27" x2="50" y2="37"/>
            <line x1="53" y1="27" x2="53" y2="37"/>
        </g>
    </g>
    <g>
        <rect class="brand-plaster__strip-v" x="25" y="6" width="14" height="52" rx="7"/>
        <g class="brand-plaster__stripe">
            <line x1="27" y1="11" x2="37" y2="11"/>
            <line x1="27" y1="14" x2="37" y2="14"/>
            <line x1="27" y1="50" x2="37" y2="50"/>
            <line x1="27" y1="53" x2="37" y2="53"/>
        </g>
        <rect class="brand-plaster__pad" x="27" y="27" width="10" height="10" opacity="0.95"/>
        <g class="brand-plaster__dot">
            <circle cx="29.5" cy="29.5" r="0.9"/>
            <circle cx="32" cy="29.5" r="0.9"/>
            <circle cx="34.5" cy="29.5" r="0.9"/>
            <circle cx="29.5" cy="32" r="0.9"/>
            <circle cx="32" cy="32" r="0.9"/>
            <circle cx="34.5" cy="32" r="0.9"/>
            <circle cx="29.5" cy="34.5" r="0.9"/>
            <circle cx="32" cy="34.5" r="0.9"/>
            <circle cx="34.5" cy="34.5" r="0.9"/>
        </g>
    </g>
</svg>
